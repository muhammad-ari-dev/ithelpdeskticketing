name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    environment: IT-HELPDESK

    steps:
      # ─── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ─── 2. Docker Buildx ───────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── 3. Login Docker Hub ────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      # ─── 4. Build & Push image (backend + frontend bundled) ─────────
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ithelpdesk:latest
            ${{ secrets.DOCKER_USERNAME }}/ithelpdesk:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── 5. Deploy via SSH ──────────────────────────────────────────
      - name: Deploy to DevOps Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEVOPS_JC_HOST }}
          port: ${{ secrets.DEVOPS_JC_PORT }}
          username: ${{ secrets.DEVOPS_USERNAME }}
          key: ${{ secrets.DEVOPS_SSH_KEY }}
          passphrase: ${{ secrets.DEVOPS_PHRASE }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PAT }}

            docker rm -f ithelpdesk 2>/dev/null || true
            docker rm -f ithelpdesk-web 2>/dev/null || true
            docker ps -aq --filter "publish=8090" | xargs -r docker rm -f 2>/dev/null || true

            docker rmi ${{ secrets.DOCKER_USERNAME }}/ithelpdesk:latest 2>/dev/null || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/ithelpdesk:latest

            DOCKER_NET=$(docker inspect sqlserver-juara --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' 2>/dev/null || echo "bridge")

            docker run -d \
              --name ithelpdesk \
              --restart unless-stopped \
              --network "$DOCKER_NET" \
              -p 8090:8080 \
              -e "DB_URL=${{ secrets.DEVOPS_JC_URL }}" \
              -e "DB_USERNAME=${{ secrets.DEVOPS_JC_USERNAME }}" \
              -e "DB_PASSWORD=${{ secrets.DEVOPS_JC_PASSWORD }}" \
              ${{ secrets.DOCKER_USERNAME }}/ithelpdesk:latest
