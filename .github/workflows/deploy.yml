name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ─── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ─── 2. Docker Buildx ───────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── 3. Login Docker Hub ────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      # ─── 4. Build & Push image ──────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ithelpdesk:latest
            ${{ secrets.DOCKER_USERNAME }}/ithelpdesk:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── 5. Deploy via SSH ──────────────────────────────────────────
      - name: Deploy to DevOps Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEVOPS_JC_HOST }}
          port: ${{ secrets.DEVOPS_JC_PORT }}
          username: ${{ secrets.DEVOPS_USERNAME }}
          key: ${{ secrets.DEVOPS_SSH_KEY }}
          passphrase: ${{ secrets.DEVOPS_PHRASE }}
          script: |
            # Pull image terbaru
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PAT }}
            docker pull ${{ secrets.DOCKER_USERNAME }}/ithelpdesk:latest

            # Stop & hapus semua container yang pakai port 8080
            docker ps -q --filter "publish=8080" | xargs -r docker stop 2>/dev/null || true
            docker ps -aq --filter "publish=8080" | xargs -r docker rm  2>/dev/null || true

            # Stop & hapus container by name jika masih ada
            docker stop ithelpdesk 2>/dev/null || true
            docker rm   ithelpdesk 2>/dev/null || true

            # Paksa kill semua proses yang masih memegang port 8080
            lsof -ti:8080 | xargs -r kill -9 2>/dev/null || true

            # Tunggu port benar-benar bebas
            sleep 3

            # Jalankan container baru
            docker run -d \
              --name ithelpdesk \
              --restart unless-stopped \
              -p 8080:8080 \
              -e DB_URL="${{ secrets.DEVOPS_JC_URL }}" \
              -e DB_USERNAME="${{ secrets.DEVOPS_JC_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DEVOPS_JC_PASSWORD }}" \
              ${{ secrets.DOCKER_USERNAME }}/ithelpdesk:latest

            # Bersihkan image lama
            docker image prune -f
